<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        padding: 20px;
        background-color: #f9f9f9;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      tr:hover {
        background-color: #f1f1f1;
      }
      img {
        max-width: 100px;
        height: auto;
      }
      .item-details {
        display: flex;
        align-items: center;
      }
      .item-image {
        margin-right: 10px;
      }
      .item-description {
        max-width: 300px; 
      }

    </style>
  </head>
  <body>
    <h1>{{ heading }}</h1>
    <table>
      <thead>
        <tr>
          <th>Order Id</th>
          <th>Customer Name</th>
          <th>Total Cost</th>
        </tr>
      </thead>
      <tbody>
        {% for item in orders %}
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.customer_name }} {{ item.customer_last_name}}</td>
          <td>{{ item.total_cost|floatformat:2 }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
